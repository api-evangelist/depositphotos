apis:
- aid: depositphotos:depositphotos-enterprise-api
  name: Depositphotos Enterprise API
  description: >-
    The Enterprise API provides organizations with full content licensing workflows including searching
    331M+ assets, licensing items, invoice management, license transfer, complimentary downloads, and
    AI image generation. Supports both prepaid (balance-based) and postpaid (monthly invoiced) payment
    models. All calls use HTTPS with JSON responses and three-hour session tokens.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
